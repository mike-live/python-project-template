[project]
name = "python-project-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "environs>=15.2.0",
    "kedro>=1.5.0",
    "kedro-datasets[matplotlib,pandas]>=9.6.0",
    "kedro-mlflow>=2.0.3",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["project*", "run"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "kedro-viz>=12.5.0",
]

[tool.kedro]
package_name = "project"
project_name = "Boston Regression"
kedro_init_version = "1.5.0"
source_dir = "."

[tool.ruff]
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "F",
    "S",
    "UP"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.kedro_telemetry]
project_id = "e7596c3c45dc413fb185cdfafae10e75"
