[project]
name = "python-project-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kedro>=1.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 79
exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "F",
    "S",
    "UP"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
