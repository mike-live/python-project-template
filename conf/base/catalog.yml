"{dataset_name}@raw":
  type: pandas.CSVDataset
  filepath: ${oc.env:PROJECT_DATA_DIR}/01_raw/{dataset_name}.csv
  load_args:
    sep: ","

"{dataset_name}@model_input":
  type: pandas.CSVDataset
  filepath: "${oc.env:PROJECT_DATA_DIR}/02_model_input/{dataset_name}.csv"
  save_args:
    index: false

"{dataset_name}@regression_model":
  type: kedro_mlflow.io.models.MlflowModelTrackingDataset
  flavor: mlflow.sklearn
  save_args:
    name: "{dataset_name}_elasticnet"

"{dataset_name}@regression_metrics":
  type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset
  prefix: "{dataset_name}"

prediction_plot:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  artifact_path: plots
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: "${oc.env:PROJECT_DATA_DIR}/05_plots/actual_vs_predicted.png"
    save_args:
      dpi: 300
      bbox_inches: tight

"local_{dataset_name}@pickle":
  type: pickle.PickleDataset
  filepath: "${oc.env:PROJECT_DATA_DIR}/03_models/local_{dataset_name}.pkl"

"local_{dataset_name}@json":
  type: json.JSONDataset
  filepath: "${oc.env:PROJECT_DATA_DIR}/04_reporting/local_{dataset_name}.json"

local_prediction_plot:
  type: matplotlib.MatplotlibDataset
  filepath: "imgs/local_actual_vs_predicted.png"
  save_args:
    dpi: 300
    bbox_inches: tight

